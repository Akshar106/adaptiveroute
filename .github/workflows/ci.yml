name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: OpenAPI schema is up to date
        run: uv run python scripts/export_openapi.py --check

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: adaptiveroute
          POSTGRES_PASSWORD: adaptiveroute
          POSTGRES_DB: adaptiveroute
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adaptiveroute" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      AR_DATABASE_URL: postgresql+asyncpg://adaptiveroute:adaptiveroute@localhost:5432/adaptiveroute
      AR_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests (incl. slow model tests and dataset validation)
        run: uv run pytest -m "not live" --cov --cov-report=xml --cov-report=term-missing:skip-covered
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Image build + end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: adaptiveroute:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack
        run: docker compose up -d --wait api worker
      - name: Smoke test (health, readiness, authenticated route-only query)
        run: |
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/readyz
          KEY=$(docker compose exec -T api adaptiveroute create-api-key --name ci --role user | tail -1)
          curl -fsS -X POST localhost:8000/v1/queries \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"query": "Write a Python function that reverses a string", "strategy": "adaptive", "execute": false}' \
            | tee /tmp/route.json
          python3 -c "import json; d=json.load(open('/tmp/route.json')); assert d['status']=='routed', d"
          curl -fsS localhost:8000/metrics | grep -q ar_routing_decisions_total
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
