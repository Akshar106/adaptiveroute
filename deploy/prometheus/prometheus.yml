# Local Prometheus: scrapes the API and the Celery worker every 10s.
# (Target label is `service`, not `component`: ar_cost_usd_total has its own
# `component` label, which a same-named target label would rename.)
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files: []

scrape_configs:
  - job_name: adaptiveroute-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }

  - job_name: adaptiveroute-worker
    static_configs:
      - targets: ["worker:9100"]
        labels: { service: worker }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
