# Local Prometheus: scrapes the API and the Celery worker every 10s.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files: []

scrape_configs:
  - job_name: adaptiveroute-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { component: api }

  - job_name: adaptiveroute-worker
    static_configs:
      - targets: ["worker:9100"]
        labels: { component: worker }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
