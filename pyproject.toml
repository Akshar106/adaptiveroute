[project]
name = "adaptiveroute"
version = "0.1.0"
description = "Adaptive multi-agent query routing with benchmarked routing strategies"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Akshar Patel" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.2",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
adaptiveroute = "adaptiveroute.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "celery-types>=0.22",
    "asgi-lifespan>=2.1",
]
eval = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptiveroute"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "ASYNC",         # async pitfalls
    "S",             # bandit (security)
    "RUF",
    "PTH",           # prefer pathlib
    "TID",
]
ignore = [
    "S101",   # assert is fine in tests and for type narrowing
    "RUF012", # mutable class attrs are fine for pydantic/sqlalchemy models
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["adaptiveroute"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*", "celery.*", "kombu.*", "matplotlib.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs running Postgres + Redis (docker compose up -d postgres redis)",
    "live: calls the real LLM provider (needs GROQ_API_KEY); never run in CI",
]
addopts = "-ra --strict-markers -m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.coverage.run]
source = ["src/adaptiveroute"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
